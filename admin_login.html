<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Railway CBT</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* Background Animations */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .particle { position: absolute; width: 10px; height: 10px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; animation: float 15s infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .confetti { position: fixed; width: 10px; height: 10px; top: -10px; z-index: 0; pointer-events: none; }
        @keyframes confetti-fall { to { transform: translateY(100vh) rotate(360deg); } }
        
        /* Login Box */
        .login-container {
            background: white; border-radius: 20px; box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            overflow: hidden; max-width: 480px; width: 100%; z-index: 1;
            animation: slideUp 0.6s ease-out; position: relative;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 40px 30px; text-align: center; position: relative; overflow: hidden;
        }
        .login-header::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .icon {
            width: 80px; height: 80px; background: rgba(255,255,255,0.25); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            font-size: 40px; animation: bounce 2s ease-in-out infinite; position: relative; z-index: 1; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .login-header h1 { font-size: 32px; margin-bottom: 10px; position: relative; z-index: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .login-header p { font-size: 16px; opacity: 0.95; position: relative; z-index: 1; }
        
        .slogan {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;
            padding: 15px; text-align: center; font-size: 14px; font-style: italic; font-weight: bold; animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        
        .login-body { padding: 40px; }
        .form-group { margin-bottom: 25px; animation: fadeIn 0.8s ease-out backwards; }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; transition: all 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15); transform: translateY(-2px); }
        
        .error-message {
            background: linear-gradient(135deg, #fee 0%, #fdd 100%); border-left: 4px solid #f44336;
            color: #c33; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; animation: shake 0.5s; font-weight: bold;
        }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        .btn-login {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden; animation: fadeIn 0.8s ease-out 0.3s backwards;
        }
        .btn-login::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: rgba(255,255,255,0.3); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .btn-login:hover::before { width: 300px; height: 300px; }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5); }
        .btn-login:active { transform: translateY(-1px); }
        
        .login-footer { text-align: center; margin-top: 30px; padding-top: 25px; border-top: 2px solid #f0f0f0; animation: fadeIn 0.8s ease-out 0.4s backwards; }
        .login-footer a { color: #667eea; text-decoration: none; font-size: 15px; font-weight: 600; transition: all 0.3s; display: inline-block; }
        .login-footer a:hover { color: #764ba2; transform: translateX(5px); }
        
        .sparkle {
            position: fixed; width: 4px; height: 4px; background: white; border-radius: 50%;
            animation: sparkle 1s ease-out forwards; pointer-events: none; z-index: 100;
        }
        @keyframes sparkle { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="icon">🔐</div>
            <h1>Admin Command Center</h1>
            <p>Railway Assessment Management System</p>
        </div>
        
        <div class="slogan">
            ✨ Secure Zonal & Division Access ✨
        </div>
        
        <div class="login-body">
            {% if error %}
                <div class="error-message">
                    ⚠️ {{ error }}
                </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">👤 Admin Username</label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
                </div>
                
                <div class="form-group">
                    <label for="password">🔑 Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn-login">Secure Login →</button>
            </form>
            
            <div class="login-footer">
                <a href="{{ url_for('candidate_login') }}">Switch to Candidate Portal →</a>
            </div>
        </div>
    </div>
    
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker Registered!', reg.scope))
                    .catch(err => console.log('Service Worker Failed!', err));
            });
        }

        // Particle Background Animation
        function createParticles() {
            const particles = document.getElementById('particles');
            for(let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particles.appendChild(particle);
            }
        }
        
        // Confetti Animation
        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'];
            for(let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear ${Math.random() * 3}s infinite`;
                document.body.appendChild(confetti);
            }
        }
        
        // Sparkle Effect on Input Focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function(e) {
                for(let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle';
                        sparkle.style.left = e.target.offsetLeft + Math.random() * e.target.offsetWidth + 'px';
                        sparkle.style.top = e.target.offsetTop + Math.random() * e.target.offsetHeight + 'px';
                        document.querySelector('.login-container').appendChild(sparkle);
                        setTimeout(() => sparkle.remove(), 1000);
                    }, i * 100);
                }
            });
        });
        
        createParticles();
        createConfetti();
    </script>
</body>
</html>
